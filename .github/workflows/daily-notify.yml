name: 每日客戶進度提醒

on:
  schedule:
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install node-fetch
      - name: 執行 LINE Bot 通知
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
          APPS_SCRIPT_URL:    ${{ secrets.APPS_SCRIPT_URL }}
          SALES_USERIDS:      ${{ secrets.SALES_USERIDS }}
          STALE_DAYS:         "1"
        run: node notify.js
